name: Build macOS app

# Every push to main builds the app and publishes a new GitHub Release with the
# next patch version (v0.1.0, v0.1.1, ...). Pushing a v* tag by hand releases
# that exact version. Pull requests only build and upload an artifact.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Releases on main run one at a time so two pushes never pick the same version.
  group: build-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # create tags and GitHub Releases
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags are needed to compute the next version

      - name: Compute version
        id: version
        run: |
          base="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)"
          release=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF_NAME" == "main" ]]; then
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ -z "$latest" ]]; then
              version="$base"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$major.$minor.$((patch + 1))"
            fi
            release=true
          else
            version="$base-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version: $version (release: $release)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform and build tools
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" || { echo "::error::ANDROID_HOME is not set on this runner"; exit 1; }
          if ! ls "$sdk"/platforms/android-*/android.jar >/dev/null 2>&1 \
             || ! ls "$sdk"/build-tools/*/d8 >/dev/null 2>&1; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          fi
          swift --version
          java -version
          ls "$sdk/platforms" "$sdk/build-tools"

      - name: Build Phone Farm.app (universal)
        env:
          PHONE_FARM_UNIVERSAL: "1"
          PHONE_FARM_VERSION: ${{ steps.version.outputs.version }}
          PHONE_FARM_BUILD: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          app=".build/Phone Farm.app"
          lipo -info "$app/Contents/MacOS/PhoneFarm"
          test -f "$app/Contents/Resources/KeyboardReader.dex"
          test -f "$app/Contents/Resources/ai-key.enc.json"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"

      - name: Package
        id: package
        run: |
          zip="PhoneFarm-macOS-v${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent ".build/Phone Farm.app" "$zip"
          shasum -a 256 "$zip" | tee "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: PhoneFarm-macOS-v${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.zip }}.sha256" \
            --target "$GITHUB_SHA" --title "Phone Farm $TAG" --generate-notes
